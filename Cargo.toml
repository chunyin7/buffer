[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
buffer-core = { path = "crates/buffer-core" }
buffer-math = { path = "crates/buffer-math" }
buffer-modal = { path = "crates/buffer-modal" }
buffer-render = { path = "crates/buffer-render" }
buffer-text = { path = "crates/buffer-text" }
buffer-ui = { path = "crates/buffer-ui" }

eframe = { version = "0.37", default-features = false }
winit = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
buffer-core = { path = "crates/buffer-core" }
buffer-math = { path = "crates/buffer-math" }
buffer-modal = { path = "crates/buffer-modal" }
buffer-render = { path = "crates/buffer-render" }
buffer-text = { path = "crates/buffer-text" }
buffer-ui = { path = "crates/buffer-ui" }

crop = { version = "0.4", default-features = false }
eframe = { version = "0.37", default-features = false }
proptest = { version = "1", default-features = false }
winit = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Unsafe code (platform glue only) needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# No unwrap/expect outside tests; documented invariants use `#[expect(..., reason = "...")]`.
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
# Hygiene.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Output goes through the `log` facade.
print_stdout = "warn"
print_stderr = "warn"
